services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bistadvisor-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Express"
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong!Passw0rd", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: BistAdvisor.Web/Dockerfile
    container_name: bistadvisor-web
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5010:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BistAdvisorDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
      AdminUsername: "admin"
      AdminPassword: "123456"

  worker:
    build:
      context: .
      dockerfile: BistAdvisor.Worker/Dockerfile
    container_name: bistadvisor-worker
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BistAdvisorDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"

volumes:
  sqlserver-data: